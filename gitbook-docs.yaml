$schema: https://api.gitbook.com/gitbook-docs.yaml
version: 1

site:
  title: Backend Knowledge Base
  structure:
    - type: section
      key: section-go
      title: Go
      path: go
      default: true
      children:
        - type: space
          key: space-go
          title: Go
          path: go
          default: true
          content:
            directory: ./docs/go
            language: ru

    - type: section
      key: section-data-messaging
      title: Данные и messaging
      path: data-messaging
      children:
        - type: space
          key: space-databases
          title: Базы данных
          path: databases
          default: true
          content:
            directory: ./docs/databases
            language: ru
        - type: space
          key: space-messaging
          title: Messaging
          path: messaging
          content:
            directory: ./docs/messaging
            language: ru

    - type: section
      key: section-networking
      title: Сети
      path: networking
      children:
        - type: space
          key: space-networking
          title: Сети
          path: networking
          default: true
          content:
            directory: ./docs/networking
            language: ru

    - type: section
